<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <form @submit.prevent="addItem">
      <input type="text" v-model="input" :style="{border:inputBorder}">
      <input type="submit" value="新增" @click="delItem(idx)">
    </form>
    <ul>
      <li v-for="item in list"></li>
      <input type="checkbox">
      <del v-if="item.done">{{item.text}}</del>
      <span v-else=>{{item.text}}</span>
      <input type="button" value="x" @click="delItem(idx)">
    </ul>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          input: '',
          list: [],
        }
      },
      computed: {
        inputBorder() {
          if (this.input.length === 0) { return }
          else if (this.input.length < 3) {
            return '5px solid red'
          } else {
            return '5px solid green'
          }
        }
      },
      methods: {
        addItem() {
          if (this.input.length < 3) return
          this.list.push({
            text: this.input,
            done: false
          })
        },
        delItem() {
          this.list.splice(idx, 1)
        }
      }
    }).mount('#app')
  </script>
</body>

</html>
