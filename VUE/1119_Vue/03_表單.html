<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
  <!-- 
  v-model = 綁定表單欄位使用者輸入的值

  修飾符:
    trim = 去除前後空白
    number = 轉成數字
    lazy = 失去焦點或按下enter才更新值
  -->
    <input type="text" v-model.trim="form.text">
    <p>{{form.text}}</p>
    <!-- radio和checkbox用v-model分組 -->
    <!-- 
    v-model 將使用者選的值傳入綁定的資料中
    value 為欄位本身的值，資料型態是文字
    :value 是vue語法，雙引號內可以是數字、布林、文字(用單引號包起來)
    -->
    <input type="radio" v-model="form.radio1" value="1">
    <input type="radio" v-model="form.radio1" value="abc">
    <input type="radio" v-model="form.radio1" value="true">
    <br>
    <input type="radio" v-model="form.radio2" :value="1">
    <input type="radio" v-model="form.radio2" :value="'abc'">
    <input type="radio" v-model="form.radio2" :value="true">
    <br>
    <!-- 用v-model和v-for一次印出所有選項 -->
    <template v-for="(checkOption, index) in checkOptions">
      <input type="checkbox" v-model="form.check" :id="'check' + index" :value="checkOption.value">
      <label :for="'check' + index">{{checkOption.label}}</label>
    </template>
    <p>{{form.check}}</p>
    <br>
    <select v-model="form.select">
      <option v-for="checkOption in checkOptions" :value="checkOption.value">{{checkOption.label}}</option>
    </select>
    <p>{{form.select}}</p>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          form: {
            text: '',
            radio1: undefined,
            radio2: undefined,
            check: [],
            select: undefined
          },
          checkOptions: [
            { label: '蘋果', value: 'apple' },
            { label: '香蕉', value: 'banana' },
            { label: '橘子', value: 'orange' }
          ]
        }
      }
    }).mount('#app');
  </script>

</body>

</html>
