<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 500px;
      height: 500px;
      border: 10px solid #fe9;
    }

    .bg {
      background-image: url(./images/01.jpg);
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    .object-fit {
      width: 100%;
      height: 100%;
      /* 將圖片尺寸設定成與父元素等寬、高，雖可使圖片完整塞進容器內，但會破壞比例 */
      object-fit: cover;
      object-position: 75%;
      /* 只寫單值，另一值自動設定center或50% */
      object-position: 75% 50%;
    }
  </style>
</head>

<body>
  <h1>background-image</h1>
  <div class="box bg"></div>
  <br>
  <h1>圖片 object-fit</h1>
  <p></p>
  <div class="box">
    <img src="./images/02.jpg" class="object-fit">
  </div>
</body>

</html>
