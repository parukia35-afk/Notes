<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #game {
            width: 1500px;
            height: 800px;
            box-sizing: border-box;
            border: 1px solid black;
            position: relative
        }

        #cat {
            position: absolute;
            width: 300px;
            /* 停用反白 */
            user-select: none;
            /* 停用拖曳 */
            -webkit-user-drag: none;
        }
    </style>
</head>

<body>
    <input type="button" value="開始遊戲" id="start">
    <span id="time">0</span>
    <hr>
    <div id="game">
        <img src="./cat.jpg" id="cat">
    </div>
    <script>
        const btnStart = document.getElementById('start')
        const elTime = document.getElementById('time')
        const game = document.getElementById('game')
        const cat = document.getElementById('cat')

        // 遊戲經過時間
        let time = 0
        // 計時器
        let timer = 0
        // 貓的中心點座標
        const catPos = {
            x: 0,
            y: 0
        }

        // 聲音
        const audio = new Audio()
        audio.src = './meow.mp3'

        // 遊戲區域的對角線長度就是區域內兩點的最大距離
        const maxDistance =
            Math.sqrt(Math.pow(game.clientWidth, 2) + Math.pow(game.clientHeight, 2))

        btnStart.onclick = () => {
            // 停用開始按鈕
            btnStart.disabled = true
            // 重設時間
            time = 0
            elTime.innerText = 0
            // 將貓隱藏
            cat.style.opacity = 0
            // 隨機擺放貓
            cat.style.left = Math.round(Math.random() * (game.clientWidth - cat.clientWidth)) + 'px'
            cat.style.top = Math.round(Math.random() * (game.clientHeight - cat.clientHeight)) + 'px'
            // 更新貓中心點座標
            catPos.x = cat.offsetLeft + (cat.clientWidth / 2)
            catPos.y = cat.offsetTop + (cat.clientHeight / 2)
            // 開始計時
            timer = setInterval(() => {
                time++
                elTime.innerText = time / 100

                if (time % 200 === 0) {
                    audio.play()
                }
            }, 10)
        }

        game.onmousemove = (event) => {
            // 開始按鈕沒有停用，不是遊戲中，不須計算音量
            if (!btnStart.disabled) return

            // 計算滑鼠離貓中心點的距離
            // 滑鼠在貓上時，event.target會是貓，event.offsetX就會是貓相對於game的距離
            // 在貓上時，距離直接設定為0；不在貓上才算距離
            let distance = 0
            if (event.target !== cat) {
                distance = Math.sqrt(
                    Math.pow(event.offsetX - catPos.x, 2),
                    Math.pow(event.offsetY - catPos.y, 2),
                )
            }
            // console.log(distance, event.offsetX, event.offsetY, event.target)
            audio.volume = 1 - distance / maxDistance
            // console.log(audio.volume)
        }


        cat.onclick = () => {
            if (!btnStart.disabled) return

            clearInterval(timer)
            btnStart.disabled = false
            cat.style.opacity = 1
        }


    </script>
</body>

</html>
