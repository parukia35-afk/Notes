<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* --- 基礎設定與場景容器 --- */
    .clock-container {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        /* 確保背景移動時不會產生捲軸 */
        position: relative;
        background-color: #87CEEB;
        /* 初始天空顏色 (淺藍色) */
        transition: background-color 30s linear;
        /* 天空變色過渡 (JS會控制) */
    }

    /* --- 背景與地面物件 --- */

    /* 用於產生火箭升空錯覺的容器 */
    .scene-elements {
        position: absolute;
        bottom: 0;
        width: 100%;
        /* 這是 JS 將會移動的元素 */
        transform: translateY(0);
        transition: transform 60s linear;
        /* 60分鐘的動畫循環 */
    }

    .ground {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100px;
        /* 地面高度 */
        background-color: #6C541E;
        /* 棕色地面 */
        z-index: 10;
    }

    .mountain-range {
        position: absolute;
        bottom: 50px;
        /* 位於地面之上 */
        width: 100%;
        height: 200px;
        background:
            /* 繪製兩座山 */
            linear-gradient(135deg, #4A4E53 25%, transparent 25%) 0 0,
            linear-gradient(45deg, #5D6367 25%, transparent 25%) 50% 0;
        background-size: 50% 200px;
        z-index: 5;
    }

    /* --- 雲朵與動畫 --- */
    .cloud {
        position: absolute;
        background: #fff;
        border-radius: 50%;
        box-shadow:
            100px 0 0 -15px #fff,
            40px 0 0 0 #fff;
        width: 80px;
        height: 30px;
        opacity: 0.8;
        animation: drift 40s linear infinite;
        /* 讓雲朵飄動 */
        z-index: 2;
    }

    .cloud-1 {
        top: 100px;
        left: -200px;
        /* 從視窗外開始 */
        transform: scale(1.5);
    }

    .cloud-2 {
        top: 250px;
        left: -50px;
        animation-duration: 50s;
        transform: scale(0.8);
    }

    @keyframes drift {
        from {
            transform: translateX(0)
        }

        to {
            transform: translateX(120vw)
        }

        /* 飄出視窗外 */
    }

    /* --- 火箭繪製 --- */
    .rocket {
        position: absolute;
        bottom: 90px;
        /* 初始位置：剛好在地面之上 */
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 180px;
        z-index: 20;
        /* JS 會控制這個元素的 Y 軸微幅移動 */
    }

    .nose-cone {
        width: 0;
        height: 0;
        border-left: 30px solid transparent;
        border-right: 30px solid transparent;
        border-bottom: 50px solid #D84315;
        /* 紅色尖錐 */
        margin-bottom: -1px;
    }

    .body {
        width: 60px;
        height: 130px;
        background: #E0E0E0;
        /* 淺灰色本體 */
        border-radius: 0 0 5px 5px;
        position: relative;
        border: 3px solid #424242;
    }

    .fins {
        position: absolute;
        bottom: 5px;
        left: -20px;
        width: 100px;
        height: 10px;
        /* 繪製側翼 */
        background:
            linear-gradient(45deg, transparent 40%, #D84315 40%, #D84315 100%) no-repeat left center,
            linear-gradient(-45deg, transparent 40%, #D84315 40%, #D84315 100%) no-repeat right center;
        background-size: 40px 10px;
        background-position: 0 0, 100% 0;
    }

    /* 噴射火焰 */
    .flame-container {
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        overflow: hidden;
    }

    .flame {
        width: 100%;
        height: 100%;
        background: orange;
        border-radius: 50%;
        box-shadow: 0 0 10px 5px yellow;
        animation: pulse 0.5s infinite alternate;
        /* 火焰閃爍 */
    }

    @keyframes pulse {
        from {
            transform: scale(0.8) translateY(0);
            opacity: 0.9;
        }

        to {
            transform: scale(1.1) translateY(-5px);
            opacity: 1;
        }
    }

    /* --- 時間顯示 --- */
    .time-display {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #333;
        font-size: 2em;
        font-family: sans-serif;
        z-index: 100;
    }

    /* --- 星星樣式 (初始隱藏) --- */
    .star-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        /* 讓星星不影響點擊事件 */
    }
</style>

<body>
    <div class="clock-container">
        <div class="sky-background">
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
        </div>

        <div class="scene-elements">
            <div class="mountain-range"></div>
            <div class="ground"></div>
        </div>

        <div class="rocket">
            <div class="nose-cone"></div>
            <div class="body"></div>
            <div class="fins"></div>
            <div class="flame-container">
                <div class="flame"></div>
            </div>
        </div>

        <div class="star-container"></div>

        <div class="time-display">00:00:00</div>
    </div>
    <script>
        // DOM 元素參考
        const container = document.querySelector('.clock-container');
        const sceneElements = document.querySelector('.scene-elements');
        const rocket = document.querySelector('.rocket');
        const starContainer = document.querySelector('.star-container');
        const timeDisplay = document.querySelector('.time-display');

        // 設定常量
        const CYCLE_DURATION = 60 * 60; // 60分鐘 (3600秒)
        const MAX_SCENE_HEIGHT = 20000; // 模擬足夠大的背景高度，讓地面完全沉下去
        const TO_SPACE_THRESHOLD = 30 * 60; // 30分鐘 (1800秒)

        // --- 星星相關函數 ---
        function createStar(x, y) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = `${x}vw`;
            star.style.top = `${y}vh`;
            // 設置閃爍動畫
            star.style.animation = 'twinkle 2s infinite alternate';
            starContainer.appendChild(star);
        }

        // 星星的 CSS 樣式 (JS 需搭配的額外 CSS)
        // 請將此段加入您的 <style> 標籤中
        /*
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            box-shadow: 0 0 5px white;
            border-radius: 50%;
            opacity: 0; 
        }
        @keyframes twinkle {
            0%, 50% { opacity: 0; }
            100% { opacity: 1; }
        }
        */

        let starInterval = null;

        function startStarGeneration() {
            if (starInterval) return;
            starInterval = setInterval(() => {
                // 每 10 秒隨機生成星星
                for (let i = 0; i < 5; i++) {
                    const x = Math.random() * 100; // 0-100 vw
                    const y = Math.random() * 80;  // 0-80 vh (保留下方空間)
                    createStar(x, y);
                }
            }, 10000);
        }

        function stopStarGeneration() {
            if (starInterval) {
                clearInterval(starInterval);
                starInterval = null;
            }
        }

        // --- 主要時鐘與動畫邏輯 ---
        function updateClock() {
            const now = new Date();
            // 為了以 **一小時** 為一個動畫循環，我們只取分鐘和秒鐘
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 總秒數 (0 到 3599)
            // 我們將小時的影響去除，讓它以 60 分鐘為循環
            const totalSeconds = (minutes * 60) + seconds;
            const progressRatio = totalSeconds / CYCLE_DURATION; // 0 到 1 之間的比例

            // 格式化時間顯示
            const hours = now.getHours().toString().padStart(2, '0');
            const min = minutes.toString().padStart(2, '0');
            const sec = seconds.toString().padStart(2, '0');
            timeDisplay.textContent = `${hours}:${min}:${sec}`;

            // 1. 背景沉降動畫 (模擬火箭緩慢上升)

            // 計算背景要向上移動的距離 (讓火箭看起來上升)
            // 循環開始 (0s) 為 0，到 3600s 接近 MAX_SCENE_HEIGHT
            let translateY = progressRatio * MAX_SCENE_HEIGHT;

            // 2. 進入太空 (30分鐘標記)

            if (totalSeconds >= TO_SPACE_THRESHOLD) {
                // 從 30分鐘 (1800s) 到 60分鐘 (3600s)

                // a. 天空顏色變化: 從淺藍變為黑色/深空
                const spaceRatio = (totalSeconds - TO_SPACE_THRESHOLD) / TO_SPACE_THRESHOLD; // 0 到 1
                const r = Math.max(0, 135 - Math.floor(spaceRatio * 135)); // R: 135 -> 0
                const g = Math.max(0, 206 - Math.floor(spaceRatio * 206)); // G: 206 -> 0
                const b = Math.max(0, 235 - Math.floor(spaceRatio * 235)); // B: 235 -> 0
                container.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;

                // b. 星星出現
                startStarGeneration();

            } else {
                // 未到太空
                container.style.backgroundColor = '#87CEEB';
                stopStarGeneration();
                // 清除所有星星
                starContainer.innerHTML = '';
            }

            // 3. 結尾衝刺 (最後 3 秒)
            const END_TIME = CYCLE_DURATION - 3; // 3597秒

            if (totalSeconds >= END_TIME) {
                // 進入加速階段
                const accelerationRatio = (totalSeconds - END_TIME) / 3; // 0 到 1

                // 背景移動突然加速
                translateY += accelerationRatio * (MAX_SCENE_HEIGHT * 0.1); // 額外增加 10% 的移動距離

                // 火箭衝出視窗 (讓火箭本體向上移動)
                const rocketOffset = -accelerationRatio * container.clientHeight * 1.5; // 移動到視窗上方 1.5 倍高
                rocket.style.transform = `translateX(-50%) translateY(${rocketOffset}px)`;

                // 讓火焰變大
                document.querySelector('.flame').style.transform = `scale(${1 + accelerationRatio * 2})`;

            } else {
                // 正常緩慢上升階段
                rocket.style.transform = `translateX(-50%) translateY(0)`;
                document.querySelector('.flame').style.transform = `scale(1)`;
            }

            // 應用背景移動
            // 使用負值來模擬地面物件向下沉
            sceneElements.style.transform = `translateY(${-translateY}px)`;
        }

        // 每秒更新一次
        setInterval(updateClock, 1000);

        // 網頁載入時先執行一次，避免延遲
        updateClock();
    </script>
</body>

</html>
