<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    .center {
      text-align: center;
    }

    .blue {
      color: blue;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- v-bind，綁定標籤屬性 -->
    <img v-bind:src="img" width="50" />
    <img :src="img" width="50" />
    <a v-for="value in links" :href="value.url">{{value.text}}</a>

    <!-- 綁定style -->
    <!-- 1. 全綁一起 -->
    <p :style="textStyle">綁定一個樣式物件</p>

    <!-- 2. 分開綁 -->
    <!-- style綁定{}物件，可以和一般的style同時存在 -->
    <p :style="{color:textColor,textAlign}" style="font-weight: bold">
      nline Object Style Binding:行內物件式 style 綁定
      <!-- JS物件語法糖:當key和value的變數名稱相同時，可以省略只寫一個 -->
    </p>
    <!-- 綁定class -->

    <!-- 1. 陣列綁法: 陣列內所有的 class 都綁上去 -->
    <p :class="classArray">陣列綁class</p>
    <!-- 2. 物件綁法: 物件內值為true的屬性才綁，false就不綁 -->
    <p :class="classObject">物件綁class</p>
  </div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script>
    Vue.createApp({
      data() {
        return {
          img: "https://tw.portal-pokemon.com/play/resources/pokedex/img/pm/f3868a6a16c75d75435819deab8bab97926fc54c.png",
          links: [
            { text: "Github", url: "https://github.com" },
            { text: "Google", url: "https://google.com" },
          ],
          textStyle: {
            color: "lightcoral",
            textAlign: "center",
            backgroundColor: "lightblue",
          },
          textColor: "lightgreenn",
          textAlign: "right",

          classArray: ["center"],
          classObject: {
            blue: true,
            center: false,
          },
        };
      },
    }).mount("#app");
  </script>
</body>

</html>
