<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScrollTrigger</title>
  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    section{
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    section:nth-child(odd){
      background: lightcyan;
      justify-content: center;
    }
    section:nth-child(even){
      background: lightpink;
      justify-content: center;
    }
    section h2{
      position: absolute;
      top: 0;
      left: 0;
    }
    .box{
      width: 100px;
      height: 100px;
      color: white;
      background: darkorchid;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .active{
      background: red;
    }
  </style>
</head>
<body>
  <!-- GSAP -->
  <script src="./gsap/gsap.js"></script>
  <!-- plugin -->
  <script src="./gsap/ScrollTrigger.js"></script>
  <!-- JQ -->
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js' integrity='sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==' crossorigin='anonymous'></script>
  <script>
    // 註冊套件
    gsap.registerPlugin(ScrollTrigger)
  </script>
  <section></section>
  <section>
    <h2>1. 設定 trigger 與 start、end</h2>
    <div class="box a1">a1</div>
  <script>
    const tween1=gsap.to('.a1',{
      scrollTrigger:{
        trigger:'.a1', //觸發者是誰
        markers:true,

// ---------------------預設的start、end---------------------
        // start,end 的第一值為一組:表示觸發者的位置(start位於觸發者頂部、end位於觸發者底部)，第二值為一組:表示視窗的位置(scroller-start位於視窗底部、scroller-end位於視窗頂部)
        start:'top bottom',// 當scroller-start的位置碰觸到觸發者 start的位置
        end:'bottom top',
// ----------------------------------------------------------

        start:'50px 60%',
        end:'bottom 30%',

        // start:'center center',
        // end:()=>`+=${$('.a1').height()}`,
      },
      x:'85vw',
      duration:3,
      ease:'none'
    })
  </script>
  </section>
  <section id="sectoin2">
    <h2>2. 設定 toggleActions</h2>
    <div class="box b1">b1</div>
    <script>
      const tween2=gsap.to('.b1',{
        scrollTrigger:{
          trigger:'.b1',
          start:'top center',
          end:'bottom 20%',
          markers:true,
          /* toggleActions的四個值分別對應四個階段:
            1.進入觸發區域時(onEnter)=>scroller start(綠)碰到 trigger 的 start(綠)
            2.離開觸發區域時(onLeave)=>scroller end(紅)碰到 trigger 的 end(紅)
            3.重新進入觸發區域時(onEnterBack)=>scroller end(紅)返回時碰到 trigger 的 end(紅)
            4.重新離開觸發區域時(onLeaveBack)=>scroller start(綠)返回時碰到 trigger 的 start(綠)

            預設為:play pause none none
            四值僅可為 play pause resume reverse restart(重播) reset(重置且不播放) complete(跳到完播狀態) none
          */
          toggleActions:'play pause resume reverse',
          toggleClass:{
            target:['.b1'],
            className:['active']
          }
        },
        x:'85vw',
        duration:3,
        ease:'none'
      })
    </script>
  </section>
  <section id="sectoin3">
    <h2>3. 設定 scrub</h2>
    <div class="box c1">c1</div>
    <script>
      const tween3=gsap.to('.c1',{
        scrollTrigger:{
          trigger:'.c1',
          start:'top 60%',
          end:'bottom 40%',
          scrub:true, /* 使得動畫進度會跟隨滾動軸進入觸發區域到離開動畫區域的進度，在這範圍內滾動軸往回移動會使動畫倒退回其根據的進度。
          在設定scrub後，動畫的duration會失效。 */
          scrub:3, // 3秒後跟上滾動軸的進度
          markers:true,
        },
        x:'85vw',
        rotation:3600,
        backgroundColor:'red',
        duration:5,
        ease:'none'
      })
    </script>
  </section>
  <section id="section4">
    <h2>4. timeline 與 scrollTrigger</h2>
    <div class="box d1">d1</div>
    <script>
      const tl=gsap.timeline({
        scrollTrigger:{
          trigger:'.d1',
          start:'center 80%',
          end:'center 20%',
          scrub:true,
          markers:true,
        }
      })
      tl
        .to('.d1',{
          x:'85vw',
          duartion:1
        })
        .to('.d1',{
          rotation:360,
          background:red,
        })
        .to('.d1',{
          
        })
    </script>
  </section>
</body>
</html>
