<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.css' />

  <title>GSAP3 - tween methods</title>
  <style>
    body {
      padding: 20px 0;
    }

    .wrap {
      width: 600px;
      height: 300px;
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .box1 {
      width: 50px;
      height: 50px;
      margin: 5px;
      background: #000;
    }

    button {
      margin-bottom: 10px;
    }

    h4 {
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h3>tween 的方法</h3>
    <p>
      操控 tween 動畫時，使用<b class="bg-danger text-white"> tween 的方法</b>來控制或修改動畫。
      參考：<a href="https://greensock.com/docs/v3/GSAP/Tween" target="_blank">https://greensock.com/docs/v3/GSAP/Tween</a>
    </p>
    <div style="background-color:#eee;">
      <div class="box1"></div>
    </div>

    <div class="row">
      <div class="col">
        <h4>控制動畫的方法</h4>
        <button id="play">play 正向播放</button>
        <button id="reverse">reverse 反向播放</button>
        <button id="pause">pause 暫停</button>
        <button id="resume">resume 恢復</button>
        <button id="restart">restart 重播</button>
        <button id="seek">seek 跳至某個時間點</button>

        <h4>延遲、重複方法</h4>
        <button id="delay">delay</button>
        <button id="repeat">repeat(1)</button>
        <button id="repeatDelay">repeatDelay</button>

        <h4>進度相關方法</h4>
        <button id="progress">progress 與 totalProgress</button>
        <button id="time">time 與 totalTime</button>
        <button id="duration">duration 與 totalDuration</button>
        <button id="timeScale">timeScale</button>

        <h4>其他方法</h4>
        <button id="targets">targets 與 then</button>
        <button id="iteration">iteration</button>
      </div>
      <div class="col">
        <h4>狀態</h4>
        <p id="paused-text">paused 狀態（動畫目前是否暫停）：</p>
        <p id="reversed-text">reversed 狀態（動畫是否反向進行）：</p>
        <p id="isActive-text">isActive 狀態（動畫是否進行中）：</p>

        <hr>

        <h4>進度</h4>
        <p id="progress-text">progress：</p>
        <p id="totalProgress-text">totalProgress：</p>
        <p id="time-text">time：</p>
        <p id="totalTime-text">totalTime：</p>
        <p id="duration-text">duration：</p>
        <p id="totalDuration-text">totalDuration：</p>

        <hr>

        <h4>其他</h4>
        <p id="iteration-text">iteration：</p>
      </div>
    </div>
  </div>

  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js'></script>
  <script src="./gsap/gsap.js"></script>

  <script>
    const tweenText={
      paused:'paused狀態(動畫目前是否暫停)',
      reversed:'reversed狀態(動畫目前是否反向進行)',
      isActive:'isActive狀態(動畫目前是否進行中)',
    }
    const tween=gsap.to('.box1',{
      x:$('.container').width() - $('box1')
      .width(),
      paused:true,
      reversed:false,
      duration:5,
      ease:'none',
    })
    // 正向播放:從目前播放頭(play head)的位置正向播放
    $('#play').on('click',()=>{
      tween.play()
      tween.play(3) //從第3秒開始正向播放
    })
    // 反向播放:從目前播放頭的位置反向播放
    $('#reverse').on('click',()=>{
      tween.reverse()
      tween.reverse(3) //從第3秒開始反向播放
    })
    $('#seek').on('click',()=>{
      tween.seek(3)
    })
    $('#delay').on('click',()=>{
      tween.play().delay(3) //delay()要在play()後使用才有效果
    })
    $('#repeat').on('click',()=>{
      tween.repeat(3).play()
      console.log(tween.repeat()) // 取得重複播放次數
    })
  $('#repeatDelay').on('click',()=>{
    tween.repeatDelay(3) // 設定重複播放時的延遲時間
    tween.repet(1).play().delay() // delay設定初始播放的延遲時間
  })
  $('.progress').on('click',()=>{
  
  })
  </script>
</body>

</html>
