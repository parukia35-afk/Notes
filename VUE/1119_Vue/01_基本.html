<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <div id="app">
      <!-- {{}}或v-text，將資料以文字顯示資料 = .innerText = .text() -->
      <h1>標題:{{title}}</h1>
      <!--v-text是指令，會覆蓋標籤內的東西-->
      <h1 v-text="title">123456</h1>
      <!-- v-html，將資料以HTML顯示 = innerHTML = .html() -->
      <div>{{img}}</div>
      <div v-text="img"></div>
      <div v-html="img"></div>
      <!-- v-if，判斷式，不符合者會直接不存於DOM -->
      <div v-if="num>10">大於10</div>
      <div v-else-if="num===10">等於10</div>
      <div v-else="num<10">小於10</div>
      <!-- v-show，判斷式，不符合者display:none(仍存在於DOM) -->
      <div v-show="num>10">大於10</div>
      <div v-show="num===10">等於10</div>
      <div v-show="num<10">小於10</div>
      <hr />
      <!-- 迴圈 v-for v-for="值 in 陣列" v-for="(值,索引) in 陣列" -->
      <ul>
        <li v-for="value in pokemons">{{value}}</li>
      </ul>
      <ul>
        <li v-for="(value,i) in pokemons">索引是{{i}}時是{{value}}</li>
      </ul>
      <!-- v-for和v-if不能同時用在一個標籤上，因為會有兩層涵義。1.符合才跑迴圈? 2.跑迴圈後符合才顯示? -->
      <!-- 必須使用template標籤輔助才能做到v-if和v-for混用 -->
      <!-- template只能配合v-if和v-for使用 -->
      <ul>
        <template v-for="value in pokemons">
          <li v-if="value==='火球鼠'">{{value}}</li>
        </template>
      </ul>
      <template v-for="(value,i) in pokemons">
        <p>{{i}}</p>
        <p>{{value}}</p>
      </template>
    </div>
    <script>
      Vue.createApp({
        data() {
          return {
            title: "特別的愛給特別的波加曼",
            img: '<img src="https://tw.portal-pokemon.com/play/resources/pokedex/img/pm/f3868a6a16c75d75435819deab8bab97926fc54c.png" width="200px" / >',
            num: 10,
            pokemons: ["火球鼠", "菊草葉", "小鋸鱷"],
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
