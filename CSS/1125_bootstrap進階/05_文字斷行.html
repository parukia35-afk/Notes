<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/bootstrap.css">
</head>

<body>
    <div class="container">
        <h2>文字斷行</h2>
        <p>英文單字如果太長，沒有空白，會超過容器的寬度，可以使用 .text-break 來斷行</p>
        <p class="bg-info" style="width:300px;">Pneumonoultramicroscopicsilicovolcanoconiosis</p>
        <p class="bg-info text-break" style="width:300px;">Pneumonoultramicroscopicsilicovolcanoconiosis</p>
    </div>

    <div class="container">
        <h2>轉大小寫、單詞首字大寫</h2>
        <p class="text-capitalize">capiTaliZed text hello world.</p>
        <p class="text-lowercase">capiTaliZed text hello world.</p>
        <p class="text-uppercase">capiTaliZed text hello world.</p>
    </div>
</body>

</html>
