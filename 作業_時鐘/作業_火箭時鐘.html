<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作業_火箭時鐘</title>
    <style>
        html,
        body {
            height: 100vh;
            background: linear-gradient(to top, #B0E0E6, #87CEEB);
            margin: 0;
            overflow: hidden;
        }

        #clock {
            width: 200px;
            height: 200px;
            background: gray;
            border-radius: 50%;
            position: fixed;
            opacity: 0.8;
            top: 0;
            right: 0;
            z-index: 1;
        }

        #hour {
            width: 20%;
            height: 8px;
            background: pink;
            position: absolute;
            left: 30%;
            top: calc(50% - 4px);
            transform-origin: right center;
        }

        #minute {
            width: 40%;
            height: 6px;
            background: skyblue;
            position: absolute;
            left: 10%;
            top: calc(50% - 3px);
            transform-origin: right center;
        }

        #second {
            width: 45%;
            height: 4px;
            background: greenyellow;
            position: absolute;
            left: 5%;
            top: calc(50% - 2px);
            transform-origin: right center;
        }

        /* 數字時間 */
        #currentTime {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            z-index: 1;
        }

        /* 背景整體 */
        #background {
            width: 100%;
            height: auto;
            position: absolute;
        }

        .cloud {
            width: 10vw;
            height: 7vw;
            background: white;
            opacity: 0.7;
            border-radius: 50%;
            position: absolute;
            top: 15%;
            left: -20%;
            /* animation-delay: 0s; */
        }

        .cloud::before {
            content: '';
            width: 80%;
            height: 70%;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: -10%;
        }

        .cloud::after {
            content: '';
            width: 60%;
            height: 57%;
            background: whitesmoke;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 60%;
        }

        .cloud2 {
            width: 10vw;
            height: 7vw;
            background: white;
            opacity: 0.7;
            border-radius: 50%;
            position: absolute;
            top: -10%;
            left: 80%;
            /* animation-delay: -10s; */
        }

        .cloud2::before {
            content: '';
            width: 65%;
            height: 80%;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 70%;
            left: -20%;
        }

        .cloud2::after {
            content: '';
            width: 140%;
            height: 70%;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 80%;
            left: 20%;
        }

        /* 新增雲朵3 */
        .cloud3 {
            width: 15vw;
            height: 8vw;
            background: whitesmoke;
            opacity: 0.6;
            border-radius: 50%;
            position: absolute;
            top: 10%;
            left: 70%;
            /* animation-delay: -25s; */
        }

        .cloud3::before {
            content: '';
            width: 60%;
            height: 70%;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: -15%;
        }

        .cloud3::after {
            content: '';
            width: 90%;
            height: 60%;
            background: #f5f5f5;
            border-radius: 50%;
            position: absolute;
            top: 40%;
            left: 50%;
        }

        .cloud4 {
            width: 12vw;
            height: 7vw;
            background: #f0f0f0;
            opacity: 0.65;
            border-radius: 50%;
            position: absolute;
            top: 20%;
            left: 40%;
            /* animation-delay: -5s; */
        }

        .cloud4::before {
            content: '';
            width: 50%;
            height: 60%;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 60%;
            left: -20%;
        }

        .cloud4::after {
            content: '';
            width: 80%;
            height: 50%;
            background: #e8e8e8;
            border-radius: 50%;
            position: absolute;
            top: 30%;
            left: 50%;
        }

        .cloud5 {
            width: 18vw;
            height: 9vw;
            background: #ffffff;
            opacity: 0.7;
            border-radius: 50%;
            position: absolute;
            top: 5%;
            left: 10%;
            /* animation-delay: -15s; */
        }

        .cloud5::before {
            content: '';
            width: 70%;
            height: 60%;
            background: #f8f8f8;
            border-radius: 50%;
            position: absolute;
            top: 40%;
            left: -20%;
        }

        .cloud5::after {
            content: '';
            width: 80%;
            height: 50%;
            background: #f0f0f0;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 40%;
        }

        /* 超高空雲1 */
        .cloud6 {
            width: 6vw;
            height: 3vw;
            background: #fafafa;
            opacity: 0.25;
            border-radius: 50%;
            position: absolute;
            top: -90%;
            left: 10%;
            /* animation-delay: -30s; */
        }

        .cloud6::after::before {
            content: '';
            width: 50%;
            height: 40%;
            background: #f5f5f5;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: -10%;
        }

        .cloud6::after {
            content: '';
            width: 50%;
            height: 50%;
            background: #f0f0f0;
            border-radius: 50%;
            position: absolute;
            top: 40%;
            left: 50%;
        }

        /* 超高空雲2 */
        .cloud7 {
            width: 5vw;
            height: 2.5vw;
            background: #f8f8f8;
            opacity: 0.2;
            border-radius: 50%;
            position: absolute;
            top: -80%;
            left: 50%;
            /* animation-delay: -20s; */
        }

        .cloud7::before {
            content: '';
            width: 60%;
            height: 50%;
            background: #f5f5f5;
            border-radius: 50%;
            position: absolute;
            top: 40%;
            left: -20%;
        }

        .cloud7::after {
            content: '';
            width: 50%;
            height: 40%;
            background: #f0f0f0;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
        }

        /* 超高空雲3 */
        .cloud8 {
            width: 7vw;
            height: 3.5vw;
            background: #ffffff;
            opacity: 0.22;
            border-radius: 50%;
            position: absolute;
            top: -70%;
            left: 30%;
            /* animation-delay: -12s; */
        }

        .cloud8::before {
            content: '';
            width: 50%;
            height: 50%;
            background: #f5f5f5;
            border-radius: 50%;
            position: absolute;
            top: 60%;
            left: -10%;
        }

        .cloud8::after {
            content: '';
            width: 60%;
            height: 40%;
            background: #f0f0f0;
            border-radius: 50%;
            position: absolute;
            top: 40%;
            left: 50%;
        }

        /* 超高空雲4 */
        .cloud9 {
            width: 6.5vw;
            height: 3.2vw;
            background: #f9f9f9;
            opacity: 0.18;
            border-radius: 50%;
            position: absolute;
            top: -60%;
            left: 70%;
            /* animation-delay: -3s; */
        }

        .cloud9::before {
            content: '';
            width: 50%;
            height: 45%;
            background: #f5f5f5;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: -15%;
        }

        .cloud9::after {
            content: '';
            width: 55%;
            height: 40%;
            background: #f0f0f0;
            border-radius: 50%;
            position: absolute;
            top: 45%;
            left: 50%;
        }

        /* 超高空雲10 */
        .cloud10 {
            width: 7vw;
            height: 3.5vw;
            background: #ffffff;
            opacity: 0.4;
            border-radius: 50%;
            position: absolute;
            top: -95%;
            left: 20%;
            /* animation-delay: -18s; */
        }

        .cloud10::before {
            content: '';
            width: 55%;
            height: 45%;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 45%;
            left: -15%;
        }

        .cloud10::after {
            content: '';
            width: 50%;
            height: 40%;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 40%;
            left: 55%;
        }

        /* 超高空雲11 */
        .cloud11 {
            width: 8vw;
            height: 4vw;
            background: #ffffff;
            opacity: 0.4;
            border-radius: 50%;
            position: absolute;
            top: -85%;
            left: 65%;
            /* animation-delay: -8s; */
        }

        .cloud11::before {
            content: '';
            width: 60%;
            height: 45%;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: -15%;
        }

        .cloud11::after {
            content: '';
            width: 55%;
            height: 45%;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 45%;
            left: 50%;
        }

        /* 超高空雲12 */
        .cloud12 {
            width: 7vw;
            height: 3.5vw;
            background: #ffffff;
            opacity: 0.4;
            border-radius: 50%;
            position: absolute;
            top: -70%;
            left: 40%;
            /* animation-delay: -22s; */
        }

        .cloud12::before {
            content: '';
            width: 55%;
            height: 45%;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 55%;
            left: -10%;
        }

        .cloud12::after {
            content: '';
            width: 50%;
            height: 40%;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 40%;
            left: 55%;
        }

        /* 雲朵飄動動畫 */
        .clouds {
            animation: cloud-float 40s linear infinite;
        }

        @keyframes cloud-float {
            0% {
                transform: translateX(-100vw);
            }

            /* 移動到右側畫面外結束 */
            100% {
                transform: translateX(100vw);
            }
        }

        .earth {
            width: 100%;
            height: 20vh;
            background: #B05C4F;
        }

        .city {
            width: 100%;
            height: auto;
            vertical-align: middle;
        }

        /* 火箭本體 */
        #rocket-container {
            position: absolute;
            left: 50%;
            bottom: 10%;
            transform: translateX(-50%)scale(0.5);
            transform-origin: bottom center;
        }

        /* 火焰 */
        #rocket-container::after {
            content: '';
            width: 150px;
            height: 250px;
            background: linear-gradient(red, orange);
            position: absolute;
            left: 50%;
            bottom: -8%;
            transform: translateX(-50%);
            border-radius: 50% 50% 70% 70%;
            filter: blur(7px);
            z-index: -1;
            animation: flame-anim 0.3s infinite alternate;
        }

        /* 控制火焰飄動動畫 */
        @keyframes flame-anim {
            0% {
                transform: translateX(-50%) scale(1, 0.8);
            }

            50% {
                transform: translateX(-48%) scale(1.1, 1.1);
            }

            100% {
                transform: translateX(-52%) scale(0.9, 0.8);
            }
        }
    </style>
</head>

<body>
    <div id="clock">
        <div id="hour"></div>
        <div id="minute"></div>
        <div id="second"></div>
    </div>
    <div id="currentTime"></div>
    <div id="background">
        <div class="cloud clouds"></div>
        <div class="cloud2 clouds"></div>
        <div class="cloud3 clouds"></div>
        <div class="cloud4 clouds"></div>
        <div class="cloud5 clouds"></div>
        <div class="cloud6 clouds"></div>
        <div class="cloud7 clouds"></div>
        <div class="cloud8 clouds"></div>
        <div class="cloud9 clouds"></div>
        <div class="cloud10 clouds"></div>
        <div class="cloud11 clouds"></div>
        <div class="cloud12 clouds"></div>
        <div class="cloud clouds" style="width: 20vw;height: 10vw;top: 5%;left: 50%;"></div>
        <div><img class="city" src="./img/city.png"></div>
        <div class="earth"></div>
    </div>
    <div id="rocket-container">
        <img class="rocket" src="./img/rocket.png">
    </div>
    <script>
        const elHour = document.getElementById('hour')
        const elMinute = document.getElementById('minute')
        const elSecond = document.getElementById('second')
        const currentTime = document.getElementById('currentTime')
        const background = document.getElementById('background')
        // 設定背景初始距離視窗頂部多少距離，要讓background貼齊視窗底部
        function updateBackgroundTop() {
            const bgHeight = background.offsetHeight
            background.style.top = (window.innerHeight - bgHeight) + 'px'
        }
        updateBackgroundTop()
        window.addEventListener('resize', updateBackgroundTop)

        const clock = () => {
            const date = new Date()
            const h = date.getHours()
            const m = date.getMinutes()
            const s = date.getSeconds()

            elHour.style.transform = `rotate(${h * 30 + 90}deg)`
            elMinute.style.transform = `rotate(${m * 6 + 90}deg)`
            elSecond.style.transform = `rotate(${s * 6 + 90}deg)`
            currentTime.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`

            const totalSecond = m * 60 + s
            let progress = Math.min(totalSecond / 1800, 1)
            const bgHeight = background.offsetHeight;
            background.style.transform = `translateY(${progress * bgHeight}px)`;
        }

        setInterval(clock, 1000)
        clock()

    </script>
</body>

</html>
